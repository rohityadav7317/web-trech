<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Variables</title>
</head>
<body>
    <h2>JavaScript Variables Example</h2>

    <p id="result"></p>

    <script>
        var name = "Rahul";
        let age = 20;
        const course = "B.Tech";

        document.getElementById("result").innerHTML =
            "Name: " + name + "<br>" +
            "Age: " + age + "<br>" +
            "Course: " + course;
    </script>
</body>
</html>
