<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Types of CSS</title>

    <!-- Internal CSS -->
    <style>
        h2 {
            color: blue;
        }

        p {
            font-size: 18px;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="3.css">
</head>

<body>

    <!-- Inline CSS -->
    <h1 style="color: red;">Inline CSS</h1>

    <!-- Internal CSS -->
    <h2>Internal CSS</h2>
    <p>This paragraph uses Internal CSS.</p>

    <!-- External CSS -->
    <h3>External CSS</h3>

</body>
</html>
