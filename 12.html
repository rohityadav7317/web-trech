<!DOCTYPE html>
<html>
<head>
    <title>My Home Page</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
        }

        nav {
            background-color: #555;
            padding: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        main {
            padding: 40px;
        }

        footer {
            background-color: #333;
            color: white;
            padding: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Home Page</h1>
        <p>My First Web Technology Project</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
    </nav>

    <main id="home">
        <h2>Home</h2>
        <p>Welcome to my website.</p>

        <section id="about">
            <h2>About Us</h2>
            <p>This is a basic home page created using HTML and CSS.</p>
        </section>

        <section id="services">
            <h2>Our Services</h2>
            <p>We provide web development services.</p>
        </section>

        <section id="contact">
            <h2>Contact Us</h2>
            <p>Email: example@gmail.com</p>
        </section>
    </main>

    <footer>
        <p>Copyright 2026 My Website</p>
    </footer>

</body>
</html>
